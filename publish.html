<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>發布新聞</title>

<style>

body{
    background:#0b1120;
    color:white;
    font-family:Arial,sans-serif;
    padding:30px;
}

.card{
    background:#111827;
    padding:20px;
    border-radius:15px;
    max-width:700px;
}

input, textarea, select{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    background:#2563eb;
    border:none;
    color:white;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}

</style>
</head>
<body>

<h1>📰 發布新聞</h1>

<div class="card">

<input
id="title"
placeholder="新聞標題">

<select id="city">

<option>A市</option>
<option>B市</option>
<option>C市</option>

</select>
<select id="permission">

<option>公開</option>
<option>爸爸</option>
<option>媽媽</option>
<option>管理員</option>
<option>SUPER管理員</option>

</select>

<textarea
id="content"
rows="8"
placeholder="新聞內容"></textarea>

<button onclick="publishNews()">
發布新聞
</button>

</div>

<script>

function publishNews(){

let title =
document.getElementById("title").value;

let city =
document.getElementById("city").value;

let content =
document.getElementById("content").value;

let news =
JSON.parse(
localStorage.getItem("news")
) || [];

let permission =
document.getElementById("permission").value;

news.push({

title:title,
city:city,
content:content,
permission:permission,
date:new Date().toLocaleString()

});

localStorage.setItem(
"news",
JSON.stringify(news)
);

alert("發布成功");

}

</script>

</body>
</html>
